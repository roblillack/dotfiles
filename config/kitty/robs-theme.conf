## name: robs-theme
## author: rob
## blurb: Based on an xterm setup from ~/.Xdefaults, by way of ~/.alacritty.toml

# Primary
foreground #333333
background #ffffff

# Cursor
cursor            #4169e1
cursor_text_color #000000

# Selection
selection_foreground #ffffff
selection_background #4169e1

# Normal colors
color0 #000000
color1 #d54e53
color2 #b9ca4a
color3 #e6c547
color4 #333399
color5 #c397d8
color6 #7777cc
color7 #eaeaea

# Bright colors: not set in the Alacritty config, so these are Alacritty's
# built-in defaults (kitty's defaults differ, so set them explicitly to match)
color8  #666666
color9  #ff3334
color10 #9ec400
color11 #e7c547
color12 #7aa6da
color13 #b77ee0
color14 #54ced6
color15 #ffffff
