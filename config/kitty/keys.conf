# Keyboard handling carried over from ~/.alacritty.toml and the
# XTerm*vt100.translations in ~/.Xdefaults.
#
# Already kitty defaults, so not repeated here:
#   ctrl+shift+c  copy to clipboard
#   ctrl+shift+v  paste from clipboard
#   shift+insert  paste from primary selection

# --- Clipboard (xterm) ------------------------------------------------------
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# --- Font size (Alacritty) --------------------------------------------------
# "current" = only this OS window, like Alacritty
map ctrl+0     change_font_size current 0
map ctrl+equal change_font_size current +1.0
map ctrl+minus change_font_size current -1.0

# --- Fullscreen (Alacritty) -------------------------------------------------
map alt+enter toggle_fullscreen

# --- Modified editing keys ---------------------------------------------------
# xterm and iTerm2 send "Rob keys" (\e[rC;BS~ etc.) for these. kitty sends
# the standard codes instead, which fish, readline (~/.inputrc) and tmux
# all understand as well:
#   alt+backspace \e\x7f    ctrl+delete \e[3;5~   ctrl+left/right \e[1;5D/C
#   alt+insert    \e[2;3~   alt+delete  \e[3;3~   alt+left/right  \e[1;3D/C
# Two keys need help: to programs that don't enable kitty's keyboard
# protocol (bash, tmux), kitty would send ctrl+backspace as ^H (= ctrl+h)
# and ctrl+tab as a plain tab. Always send the unambiguous CSI u form.
map ctrl+backspace send_text all \x1b[127;5u

# Replaces kitty's default ctrl+tab = next_tab (ctrl+shift+right still
# works); in tmux, ctrl+tab = next-window
map ctrl+tab send_text all \x1b[9;5u
